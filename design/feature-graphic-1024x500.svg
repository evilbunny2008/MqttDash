<svg viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="500" fill="#f5f5f5"/>
  
  <!-- Subtle dashboard grid pattern across background -->
  <g opacity="0.15" stroke="#333333" stroke-width="2">
    <!-- Vertical lines -->
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    
    <!-- Horizontal lines -->
    <line x1="0" y1="125" x2="1024" y2="125"/>
    <line x1="0" y1="250" x2="1024" y2="250"/>
    <line x1="0" y1="375" x2="1024" y2="375"/>
  </g>
  
  <!-- Left side: Icon area -->
  <g>
    <!-- Circular background for icon -->
    <circle cx="180" cy="250" r="140" fill="#00BCD4" opacity="0.15"/>
    
    <!-- Dashboard grid pattern (left section) -->
    <g opacity="0.3" stroke="#333333" stroke-width="3">
      <line x1="80" y1="150" x2="80" y2="350"/>
      <line x1="180" y1="150" x2="180" y2="350"/>
      <line x1="280" y1="150" x2="280" y2="350"/>
      
      <line x1="50" y1="200" x2="310" y2="200"/>
      <line x1="50" y1="250" x2="310" y2="250"/>
      <line x1="50" y1="300" x2="310" y2="300"/>
    </g>
    
    <!-- Grid dots -->
    <g fill="#999999" opacity="0.5">
      <circle cx="80" cy="200" r="6"/>
      <circle cx="180" cy="200" r="6"/>
      <circle cx="280" cy="200" r="6"/>
      
      <circle cx="80" cy="250" r="6"/>
      <circle cx="180" cy="250" r="6"/>
      <circle cx="280" cy="250" r="6"/>
      
      <circle cx="80" cy="300" r="6"/>
      <circle cx="180" cy="300" r="6"/>
      <circle cx="280" cy="300" r="6"/>
    </g>
    
    <!-- Z Icon -->
    <g transform="translate(180, 250) rotate(-8)">
      <line x1="-40" y1="-55" x2="40" y2="-55" stroke="#00BCD4" stroke-width="20" stroke-linecap="round"/>
      <line x1="40" y1="-55" x2="-40" y2="55" stroke="#00BCD4" stroke-width="20" stroke-linecap="round"/>
      <line x1="-40" y1="55" x2="40" y2="55" stroke="#00BCD4" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Right side: Text area -->
  <g>
    <!-- App name -->
    <text x="420" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#333333">
      Z2M Dash
    </text>
    
    <!-- Tagline -->
    <text x="420" y="260" font-family="Arial, sans-serif" font-size="40" fill="#666666">
      Zigbee2MQTT Control
    </text>
    
    <!-- Accent line -->
    <rect x="420" y="290" width="400" height="4" fill="#00BCD4"/>
    
    <!-- Subtitle -->
    <text x="420" y="340" font-family="Arial, sans-serif" font-size="28" fill="#999999">
      Manage your smart home devices
    </text>
  </g>
</svg>
