<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized Z with slight rotation -->
  <g transform="translate(256, 256) rotate(-8)">
    <!-- Top horizontal stroke -->
    <line x1="-60" y1="-80" x2="60" y2="-80" stroke="#00BCD4" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Diagonal stroke -->
    <line x1="60" y1="-80" x2="-60" y2="80" stroke="#00BCD4" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Bottom horizontal stroke -->
    <line x1="-60" y1="80" x2="60" y2="80" stroke="#00BCD4" stroke-width="28" stroke-linecap="round"/>
  </g>
  
  <!-- Optional: subtle shadow/depth effect under the Z -->
  <g transform="translate(256, 256) rotate(-8)" opacity="0.1">
    <line x1="-60" y1="-80" x2="60" y2="-80" stroke="#000000" stroke-width="28" stroke-linecap="round" transform="translate(4, 4)"/>
    <line x1="60" y1="-80" x2="-60" y2="80" stroke="#000000" stroke-width="28" stroke-linecap="round" transform="translate(4, 4)"/>
    <line x1="-60" y1="80" x2="60" y2="80" stroke="#000000" stroke-width="28" stroke-linecap="round" transform="translate(4, 4)"/>
  </g>
</svg>
